# Shiftt's status page. Health checks of public endpoints only: no product code, no
# credentials, no data. The endpoints answer 200 when the service can reach its database.
owner: shiftt-app
repo: status

sites:
  - name: Shiftt app
    url: https://app.shiftt.io/readyz
  - name: Shiftt API
    url: https://api.shiftt.io/readyz

status-website:
  cname: status.shiftt.io
  name: Shiftt status
  introTitle: "**Shiftt** service status"
  introMessage: Checked every five minutes. Questions or a problem to report? Write to [help@shiftt.io](mailto:help@shiftt.io).
  navbar:
    - title: Status
      href: /
    - title: Shiftt
      href: https://app.shiftt.io
